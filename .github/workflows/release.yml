name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tooling & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine cyclonedx-bom
          pip install .

      - name: Build
        run: python -m build

      - name: Verify wheel version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL_VERSION="$(unzip -p "${wheels[0]}" '*.dist-info/METADATA' | sed -n 's/^Version: //p' | head -n 1)"
          if [ "$WHEEL_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::wheel METADATA version '${WHEEL_VERSION}' does not match tag ${GITHUB_REF_NAME} (expected '${TAG_VERSION}')"
            exit 1
          fi
          echo "Wheel version ${WHEEL_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Twine check
        run: twine check dist/*

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment -o sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.4.3
        with:
          name: dist
          path: |
            dist/
            sbom.cdx.json

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC for build provenance (and PyPI Trusted Publishing once enabled)
      attestations: write  # build provenance
      contents: write      # attach assets to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist

      # Build the notes before anything publishes: a failure here must stop the
      # release before anything ships (the GitHub Release, the GHCR image, and PyPI
      # once it is enabled).
      - name: Build release notes
        run: python3 scripts/release_notes.py --to "$GITHUB_REF_NAME" > release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      # Uncomment once PyPI PEP 541 dispute #11989 is resolved:
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*
            sbom.cdx.json
