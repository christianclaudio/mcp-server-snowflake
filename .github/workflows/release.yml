name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine cyclonedx-bom

      - name: Build
        run: python -m build

      - name: Verify wheel version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL_VERSION="$(unzip -p "${wheels[0]}" '*.dist-info/METADATA' | sed -n 's/^Version: //p' | head -n 1)"
          if [ "$WHEEL_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::wheel METADATA version '${WHEEL_VERSION}' does not match tag ${GITHUB_REF_NAME} (expected '${TAG_VERSION}')"
            exit 1
          fi
          echo "Wheel version ${WHEEL_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Twine check
        run: twine check dist/*

      - name: Generate CycloneDX SBOM
        run: |
          # Describe only what ships: a clean venv with the built wheel and its
          # runtime dependencies (no pip, no build tooling from the runner).
          python -m venv --without-pip "$RUNNER_TEMP/sbom-env"
          python -m pip --python "$RUNNER_TEMP/sbom-env/bin/python" install dist/*.whl
          cyclonedx-py environment "$RUNNER_TEMP/sbom-env" -o sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: |
            dist/
            sbom.cdx.json

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Provenance comes from the separate attest job, so this job holds no attestation
    # rights and no OIDC token. Add `id-token: write` here when PyPI Trusted Publishing
    # is enabled below.
    permissions:
      contents: write      # attach assets to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist

      # Build the notes before anything publishes: a failure here must stop the
      # release before anything ships (the GitHub Release, the GHCR image, and PyPI
      # once it is enabled).
      - name: Build release notes
        run: python3 scripts/release_notes.py --to "$GITHUB_REF_NAME" > release-notes.md

      # Uncomment once PyPI PEP 541 dispute #11989 is resolved:
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*
            sbom.cdx.json
          body_path: release-notes.md

  docker:
    name: Publish Docker image
    # Ship nothing (GHCR `:latest` included) unless the publish job, which builds
    # the release notes and creates the GitHub Release, succeeded.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          # Provenance comes from the separate attest job; no buildx attestation
          # manifests (provenance or SBOM), so the pushed tag is a plain image manifest.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            UV_DYNAMIC_VERSIONING_BYPASS=${{ steps.version.outputs.version }}

  attest:
    name: Attest build provenance
    # Separate job so the OIDC token and attestation rights never share a job with
    # the GitHub Release write or the GHCR push credentials. Runs after docker (which
    # itself waits for publish), so it attests exactly the wheel/sdist that shipped
    # and the pushed image digest.
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read       # required by attest-build-provenance
      id-token: write      # Sigstore signing certificate (OIDC)
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Attest container image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.docker.outputs.image }}
          subject-digest: ${{ needs.docker.outputs.digest }}

  # MCP Registry publishing, disabled until the maintainer enables it. server.json
  # lists one OCI package, the GHCR image, so this needs no PyPI release: it runs
  # after the docker job pushes the image, which must be public and carry the
  # io.modelcontextprotocol.server.name label (see Dockerfile). It also waits for
  # the attest job, so a failed attestation stops the registry publish. To enable
  # it, uncomment the job below.
