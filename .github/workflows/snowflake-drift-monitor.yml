name: Snowflake tool count and SDK version monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC (12:00 AM EDT)
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# One drift check at a time; a manual run waits for a scheduled one instead of racing it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # open or comment on the forge-todo issue when the check fails
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Run Drift Check
        id: drift-check
        run: |
          # Capture the exit code explicitly: under the default `bash -e` a failing
          # command would end the step before DRIFT_STATUS is written.
          set +e
          uv run python scripts/check_snowflake_drift.py > drift_results.txt 2>&1
          status=$?
          set -e
          echo "DRIFT_STATUS=${status}" >> "$GITHUB_ENV"

      - name: Create or comment on issue
        if: env.DRIFT_STATUS != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let driftOutput = "No output captured.";
            try {
              driftOutput = fs.readFileSync('drift_results.txt', 'utf8');
            } catch (err) {
              console.error(err);
            }
            
            const status = process.env.DRIFT_STATUS;
            // An uncaught exception also exits 1, so drift needs the line the script
            // prints only right before `return 1`.
            const drift = status === '1' && driftOutput.includes('❌ Drift Error');
            const issueTitle = drift
              ? "Snowflake drift: registered tool count no longer matches the tool contract"
              : `Snowflake drift monitor failed (exit ${status})`;
            const summary = drift
              ? "The drift scan found that the server no longer registers the expected number of tools (`EXPECTED_TOOL_COUNT` in `scripts/check_tool_contract.py`). The latest Snowflake SDK versions on PyPI are listed for reference only; they never fail the check."
              : `The drift scan could not finish: the drift script exited ${status} before it reported a tool count, so there is no drift result.`;
            const issueBody = [
              "### Snowflake Drift Monitor",
              "",
              summary,
              "",
              "#### Scan Output",
              "```text",
              driftOutput,
              "```",
              "",
              drift
                ? "Inspect the output. If the tool count changed by mistake, fix the registration under `src/snowflake_mcp/`. If the change is intended, update `EXPECTED_TOOL_COUNT` in `scripts/check_tool_contract.py` (the drift script imports it) and the `contract` job name in `.github/workflows/ci.yml` together."
                : "Fix the failing step shown in the output, then re-run the workflow.",
            ].join("\n");

            // One open issue per failure kind: comment on it instead of opening another.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'forge-todo',
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === issueTitle);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: issueBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['forge-todo'],
              });
            }
