name: Snowflake API & SDK Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC (12:00 AM EDT)
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Run Drift Check
        id: drift-check
        run: |
          # Capture the exit code explicitly: under the default `bash -e` a failing
          # command would end the step before DRIFT_STATUS is written.
          set +e
          uv run python scripts/check_snowflake_drift.py > drift_results.txt 2>&1
          status=$?
          set -e
          echo "DRIFT_STATUS=${status}" >> "$GITHUB_ENV"

      - name: Create Issue on Failure
        if: env.DRIFT_STATUS != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let driftOutput = "No output captured.";
            try {
              driftOutput = fs.readFileSync('drift_results.txt', 'utf8');
            } catch (err) {
              console.error(err);
            }
            
            const status = process.env.DRIFT_STATUS;
            // An uncaught exception also exits 1, so drift needs the line the script
            // prints only right before `return 1`.
            const drift = status === '1' && driftOutput.includes('❌ Drift Error');
            const issueTitle = drift
              ? "Snowflake drift: registered tool count no longer matches the 140-tool contract"
              : `Snowflake drift monitor failed (exit ${status})`;
            const summary = drift
              ? "The scheduled weekly drift scan found that the server no longer registers exactly 140 tools. The latest Snowflake SDK versions on PyPI are listed for reference only; they never fail the check."
              : "The scheduled weekly drift scan could not finish (install or script error), so there is no drift result.";
            const issueBody = [
              "### Snowflake Drift Monitor",
              "",
              summary,
              "",
              "#### Scan Output",
              "```text",
              driftOutput,
              "```",
              "",
              drift
                ? "Please inspect the output, then fix the tool registration under `src/snowflake_mcp/` or update the contract in `scripts/check_snowflake_drift.py` and the contract tests together."
                : "Fix the failing step shown in the output, then re-run the workflow.",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['maintenance', 'drift', 'forge-todo']
            });
