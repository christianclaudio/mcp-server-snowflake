name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merges made by dependabot-automerge.yml use GITHUB_TOKEN, and pushes made
  # with GITHUB_TOKEN don't trigger push workflows, so the push trigger above
  # misses them. The daily run tests main itself; schedule runs only on the
  # default branch. The minute is off the hour to avoid peak scheduler load.
  schedule:
    - cron: '53 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev --python 3.12
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy src/

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Unit and mocked tests
        run: uv run pytest --cov=src/snowflake_mcp --cov-report=term-missing -q

  contract:
    name: Tool Contract Verification (140 Tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev --python 3.12
      - name: Assert 140 tool contract
        run: uv run python scripts/check_tool_contract.py

  conformance:
    name: Protocol Conformance (MCP Spec 2026-07-28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: uv sync --locked --extra dev --python 3.12
      - name: Protocol conformance suite
        run: ./scripts/check_conformance.sh

  build:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Build Wheel & Sdist
        run: uv run python -m build
      - name: Reject fallback and untagged versions
        run: uv run python scripts/check_version.py
      - name: Twine check
        run: uv run twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  docker-build:
    name: Container builder CA floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Builder fails below the ca-certificates floor
        # Raising CA_CERTIFICATES_FLOOR above any real Debian version makes the installed
        # package older than the floor, whatever version the base image or trixie-security
        # ships, so this is deterministic. The build must fail at the builder's floor check,
        # with its message, and before the pip bootstrap step starts.
        run: |
          set +e
          docker build --target builder --progress=plain \
            --build-arg CA_CERTIFICATES_FLOOR=99991231 . > ca-floor.log 2>&1
          status=$?
          set -e
          cat ca-floor.log
          if [ "$status" -eq 0 ]; then
            echo "::error::builder built with a ca-certificates floor above the installed version"
            exit 1
          fi
          if ! grep -q "is older than the floor 99991231" ca-floor.log; then
            echo "::error::builder failed, but not at the ca-certificates floor check"
            exit 1
          fi
          if grep -q -- "--require-hashes" ca-floor.log; then
            echo "::error::the pip bootstrap step started before the ca-certificates floor check failed"
            exit 1
          fi
          echo "Builder stops at the ca-certificates floor check before any pip step"
