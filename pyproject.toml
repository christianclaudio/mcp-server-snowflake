[build-system]
requires = ["hatchling>=1.32.4,<2", "uv-dynamic-versioning>=0.14.1,<0.15"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[project]
name = "mcp-server-snowflake"
dynamic = ["version"]
description = "Enterprise Model Context Protocol (MCP) server for Snowflake data cloud and Cortex AI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Christian Claudio", email = "christianclaudio@mail.com" }
]
keywords = ["snowflake", "cortex", "mcp", "model-context-protocol", "data-cloud", "ai", "mcp-server-snowflake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "mcp>=2.3.0",
    "fastmcp>=4.1.0",
    "snowflake-connector-python>=4.8.0",
    "snowflake-core>=1.13.2",
    "pydantic>=2.13.5",
    "cryptography>=50.0.2",
    "python-dotenv>=1.2.3",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.44.0,<1.45",
    "mypy>=2.3.1",
    "ruff>=0.16.9",
    "build>=1.6.1",
    "twine>=7.0.0",
]

[project.scripts]
mcp-server-snowflake = "snowflake_mcp.cli:main"
snowflake-mcp = "snowflake_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/christianclaudio/mcp-server-snowflake"
Repository = "https://github.com/christianclaudio/mcp-server-snowflake"
Issues = "https://github.com/christianclaudio/mcp-server-snowflake/issues"
Documentation = "https://github.com/christianclaudio/mcp-server-snowflake#readme"
Changelog = "https://github.com/christianclaudio/mcp-server-snowflake/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/snowflake_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "e2e: end-to-end live network tests against upstream services (run with -m e2e)",
]
addopts = "-m 'not e2e' --strict-markers --cov=src/snowflake_mcp --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
strict = true
packages = ["snowflake_mcp"]
mypy_path = "src"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
"src/snowflake_mcp/tools/*" = ["E501"]
"src/snowflake_mcp/server.py" = ["E501"]
