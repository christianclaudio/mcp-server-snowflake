[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-snowflake"
version = "1.1.1"
description = "Enterprise Model Context Protocol (MCP) server for Snowflake data cloud and Cortex AI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Christian Claudio", email = "christianclaudio@mail.com" }
]
keywords = ["snowflake", "cortex", "mcp", "model-context-protocol", "data-cloud", "ai", "mcp-server-snowflake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "mcp>=2.1.0",
    "snowflake-connector-python>=4.7.2",
    "snowflake-core>=1.13.1",
    "pydantic>=2.13.4",
    "cryptography>=50.0.0",
    "python-dotenv>=1.2.3",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
    "ruff>=0.16.4",
    "build>=1.5.0",
    "twine>=7.0.0",
]

[project.scripts]
mcp-server-snowflake = "snowflake_mcp.cli:main"
snowflake-mcp = "snowflake_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/christianclaudio/mcp-server-snowflake"
Repository = "https://github.com/christianclaudio/mcp-server-snowflake"
Issues = "https://github.com/christianclaudio/mcp-server-snowflake/issues"
Documentation = "https://github.com/christianclaudio/mcp-server-snowflake#readme"
Changelog = "https://github.com/christianclaudio/mcp-server-snowflake/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/snowflake_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = false
packages = ["snowflake_mcp"]
mypy_path = "src"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
"src/snowflake_mcp/tools/*" = ["E501"]
"src/snowflake_mcp/server.py" = ["E501"]
