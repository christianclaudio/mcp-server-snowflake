language: "en-US"

reviews:
  # 'chill' provides balanced feedback without nitpicky noise ('quiet' = critical only)
  profile: "chill"
  review_status: false

  # Auto-Review Settings
  auto_review:
    enabled: true
    drafts: false
    # Skip automatic reviews when PR title contains keywords
    ignore_title_keywords:
      - "dependabot"
      - "bump"

  # Path Filters: Exclude lockfiles, docs, manifests, and configs from review
  path_filters:
    - "!poetry.lock"
    - "!package-lock.json"
    - "!uv.lock"
    - "!.venv/**"
    - "!**.log"
    - "!CHANGELOG.md"
    - "!README.md"
    - "!server.json"
    - "!COOKBOOK.md"
    - "!.gitignore"
    - "!.coderabbit.yaml"

  # Domain Path Instructions: Enforce project-specific architectural rules automatically
  path_instructions:
    - path: "src/snowflake_mcp/tools/*.py"
      instructions: "Ensure all newly added tools declare descriptive docstrings, type annotations, and enforce explicit confirm=True parameters on all destructive drop and truncate endpoints."
    - path: "src/snowflake_mcp/connection.py"
      instructions: "Verify SnowflakeClient connection switches validate replacement credentials in an isolated client before modifying the active session."

  # Enables '🤖 Prompt for AI Agents' blocks in review comments for one-click resolution
  enable_prompt_for_ai_agents: true

  # Clean presentation settings
  poem: false
  collapse_walkthrough: true

